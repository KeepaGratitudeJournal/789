<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>換個角度看生活 - 轉角望遠鏡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #F7FAFC;
      color: #2D3748;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px 18px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #2C7A7B;
      text-align: center;
      margin: 6px 0 12px 0;
    }
    .guide-text {
      font-size: 18px;
      line-height: 1.5;
      color: #4A5568;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding: 4px;
      margin-bottom: 16px;
      border-radius: 12px;
      scrollbar-width: thin;
    }
    .tag-btn {
      background: #EDFDFD;
      border: 2px solid #B2F5EA;
      border-radius: 14px;
      padding: 12px 8px;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      color: #234E52;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      transition: all 0.15s ease-in-out;
    }
    .tag-btn.active {
      background: #319795;
      color: #FFFFFF;
      border-color: #285E61;
      transform: scale(0.98);
    }
    .tag-btn span {
      font-size: 22px;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      height: 85px;
      font-size: 18px;
      padding: 12px;
      border: 2px solid #CBD5E0;
      border-radius: 14px;
      margin-bottom: 14px;
      resize: none;
      font-family: inherit;
    }
    .btn-submit {
      width: 100%;
      background: #319795;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 151, 149, 0.3);
    }
    .btn-submit:disabled { background: #A0AEC0; }
    .result-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #FFFAF0;
      border: 2px solid #FEEBC8;
      display: none;
    }
    .result-title {
      font-size: 21px;
      font-weight: bold;
      color: #C05621;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-content {
      font-size: 19px;
      line-height: 1.7;
      color: #2D3748;
      margin-bottom: 14px;
    }
    .btn-speak {
      background: #ED8936;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }
    .btn-speak:active { background: #DD6B20; }
  </style>
</head>
<body>

<div class="container">
  <div class="title">👓 轉角望遠鏡</div>
  <div class="guide-text">
    點選下方讓您有點煩心或無奈的事，或在框框內自己寫：
  </div>

  <!-- 14 大高齡常見煩惱卡片 -->
  <div class="quick-grid">
    <button class="tag-btn" onclick="selectTag(this, '家人講話口氣很急、很大聲，讓我心裡不舒服')">
      <span>🗣️</span>家人講話急又大聲
    </button>
    <button class="tag-btn" onclick="selectTag(this, '孩子工作太忙，很少打電話或回來看我')">
      <span>🏃</span>孩子太忙少回來看我
    </button>
    <button class="tag-btn" onclick="selectTag(this, '孫子孩子回家都一直看手機，很少跟我講話')">
      <span>📱</span>後輩回家一直滑手機
    </button>
    <button class="tag-btn" onclick="selectTag(this, '身體常常這裡酸那裡痛，覺得年紀大很不中用')">
      <span>🩹</span>身體常常酸痛不適
    </button>
    <button class="tag-btn" onclick="selectTag(this, '晚上常常翻來覆去睡不好，很早就醒過來')">
      <span>🌙</span>晚上容易失眠睡不好
    </button>
    <button class="tag-btn" onclick="selectTag(this, '常常轉頭就忘記東西放哪，擔心自己記性退化')">
      <span>🔑</span>常常忘東忘西找東西
    </button>
    <button class="tag-btn" onclick="selectTag(this, '天氣不好下大雨，只能整天關在家裡好無聊')">
      <span>🌧️</span>下雨天悶在家很無趣
    </button>
    <button class="tag-btn" onclick="selectTag(this, '電視轉來轉去都沒好看的，在家發呆很悶')">
      <span>📺</span>電視看膩了在家發呆
    </button>
    <button class="tag-btn" onclick="selectTag(this, '鄰居或朋友講話酸言酸語，聽了心裡很不開心')">
      <span>💬</span>朋友鄰居講話不好聽
    </button>
    <button class="tag-btn" onclick="selectTag(this, '每天日子好像都差不多，感覺生活沒什麼特別目標')">
      <span>⏳</span>生活平淡沒什麼目標
    </button>
    <button class="tag-btn" onclick="selectTag(this, '年紀大胃口變小很多，吃東西好像都不太香')">
      <span>🍲</span>胃口變小吃東西不香
    </button>
    <button class="tag-btn" onclick="selectTag(this, '買東西或看醫生覺得開銷大，花錢有點捨不得')">
      <span>🪙</span>日常花錢心裡捨不得
    </button>
    <button class="tag-btn" onclick="selectTag(this, '家裡家務打掃做起來好費力，動作變慢很多')">
      <span>🧹</span>做家事體力不如從前
    </button>
    <button class="tag-btn" onclick="selectTag(this, '一個人待在家的時候，偶爾會覺得有點冷清孤單')">
      <span>🏡</span>一個人待在家覺得冷清
    </button>
  </div>

  <textarea id="userInput" placeholder="也可以在此自己打字或用語音說說您的煩惱..."></textarea>

  <button class="btn-submit" id="btnSubmit" onclick="getReframing()">請幸福助教換角度看 ➔</button>

  <div class="result-box" id="resultBox">
    <div class="result-title">🌟幸福助教的溫暖發現：</div>
    <div class="result-content" id="resultText"></div>
    <button class="btn-speak" onclick="speakResult()">🔊 唸給我聽</button>
  </div>
</div>

<script>
  const presetReplies = {
    "家人講話口氣很急、很大聲，讓我心裡不舒服": "大哥/大姐，家人講話急躁常常是因為外面工作步調快，或心裡急著想事情，並不是對您有意見。換個角度看，他們有事願意直接對您說，代表在您面前最不偽裝、最放心！",
    "孩子工作太忙，很少打電話或回來看我": "大哥/大姐，孩子忙碌雖然會讓人掛念，但換個角度想，孩子能在社會上認真打拼、自立自強，正是您過去教育有方最大的福氣！這也正是給您專注享受自己精彩生活的好時機！",
    "孫子孩子回家都一直看手機，很少跟我講話": "大哥/大姐，年輕人習慣看手機，但他放假願意待在您身邊坐著滑，代表在您身旁非常有安全感。換個角度想，遞上一盤水果或一杯溫水，無聲的關愛他一定能深深體會！",
    "身體常常這裡酸那裡痛，覺得年紀大很不中用": "大哥/大姐，酸痛確實很辛苦，但換個角度看，這是身體為您辛勞奉獻了幾十年發出的提醒訊號，告訴您『現在該好好休息、多寵愛自己了』。您走過那麼多風雨，身體依然陪伴著您，很值得好好感謝它！",
    "晚上常常翻來覆去睡不好，很早就醒過來": "大哥/大姐，睡不著時容易煩躁，但換個角度看，這代表大腦給了您一段安靜的獨處時光。不用勉強躺著，起來喝杯溫水、深呼吸、聽聽清晨第一聲鳥叫，享受這份沒有人打擾的自在平靜。",
    "常常轉頭就忘記東西放哪，擔心自己記性退化": "大哥/大姐，記性偶爾打結很正常，這不是退化，而是您的腦袋這輩子裝了太多豐富的人生智慧，偶爾在整理倉庫呢！換個角度想，多給自己一個會心的微笑，慢慢找就好，不用急！",
    "天氣不好下大雨，只能整天關在家裡好無聊": "大哥/大姐，下雨天雖然不能出門散步，但換個角度看，老天爺正為大地洗塵，也給了您一個不受打擾的休養時光。在家泡杯熱茶、聽聽雨聲或伸展筋骨，也是專屬於自己的品味時刻！",
    "電視轉來轉去都沒好看的，在家發呆很悶": "大哥/大姐，電視看膩了，換個角度看，這正是眼睛和大腦在提醒我們休息呢！關掉電視，閉上眼睛聽聽窗外聲音，或是整理幾張老照片，往往能發現生活裡意想不到的趣味！",
    "鄰居或朋友講話酸言酸語，聽了心裡很不開心": "大哥/大姐，聽到不中聽的話難免刺耳，但換個角度看，別人講話酸往往反映是他自己內心有不安或不滿。這正是練習『寬恕與放下』的好機會，把注意力收回給珍惜您的人，心情自然海闊天空！",
    "每天日子好像都差不多，感覺生活沒什麼特別目標": "大哥/大姐，日子看似平淡，但換個角度看，『平安、無事、規律』其實是人間最難得的福氣。今天能來社區上課、認識朋友、動動手腦，您已經踏出了非常精彩又充實的一步！",
    "年紀大胃口變小很多，吃東西好像都不太香": "大哥/大姐，胃口小一點，換個角度想，腸胃負擔變輕了，正是品嘗食物精緻滋味的好時機！每一口都細細咀嚼，感受食物的原汁原味，更能品味生活中的清爽甘美！",
    "買東西或看醫生覺得開銷大，花錢有點捨不得": "大哥/大姐，辛苦存了一輩子的積蓄，換個角度看，每一筆花在健康、美味食物或讓自己舒服的事情上，都是在獎勵過去奮鬥的自己！善待自己就是世上最划算的投資！",
    "家裡家務打掃做起來好費力，動作變慢很多": "大哥/大姐，動作慢一點不是壞事，換個角度想，放慢步調才不會匆忙跌倒。家事不用一次做完，分兩三次慢慢整理，邊做邊休息，也是一種悠閒的生活節奏！",
    "一個人待在家的時候，偶爾會覺得有點冷清孤單": "大哥/大姐，一個人的時候雖然安靜，但換個角度看，這也是世界上最自由自在的時光。沒有任何人打擾，想看什麼就看、想躺著就躺著，自己就是自己最好的心靈伴侶！"
  };

  function selectTag(element, text) {
    document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('userInput').value = text;
  }

  function getReframing() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) {
      alert("請先點選上方其中一個煩惱卡片，或自己在框框輸入喔！");
      return;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    btn.disabled = true;
    btn.innerText = "助教正在用心換角度思考中...";
    resultBox.style.display = "none";

    setTimeout(() => {
      let reply = presetReplies[input];

      // 自訂文字動態語意轉念引擎
      if (!reply) {
        if (input.includes("痛") || input.includes("病") || input.includes("累") || input.includes("酸")) {
          reply = `大哥/大姐，身體不舒服真的很辛苦。但換個角度看，這代表身體正在提醒我們要多放慢腳步、好好休息。您走過人生這麼多路，今天能停下來善待自己，就是最棒的智慧！`;
        } else if (input.includes("兒") || input.includes("女") || input.includes("孫") || input.includes("小孩")) {
          reply = `大哥/大姐，為了孩子家人操心，可見您的愛有多深。換個角度想，孩子自立也是您的福氣；試著把這份疼愛也分一點給自己，好好享受今天的活動吧！`;
        } else if (input.includes("吵") || input.includes("罵") || input.includes("氣") || input.includes("人")) {
          reply = `大哥/大姐，跟別人有摩擦難免心情不好。但換個角度看，很多時候別人的脾氣是他們自己的課題。把心放寬、練習不往心裡去，您的心靈就會海闊天空！`;
        } else if (input.includes("無聊") || input.includes("悶") || input.includes("呆") || input.includes("沒事")) {
          reply = `大哥/大姐，覺得無聊的時候，換個角度看，正是生活平安無災難的體現。今天來這裡動手折小書、跟助教聊聊，不就已經給生活添上了新的色彩嗎？`;
        } else {
          reply = `大哥/大姐，遇到「${input}」心裡難免有些鬱悶。但換個角度看，事情已經告一段落，而且您今天願意打開心胸把它說出來，代表您擁有非常豁達的智慧。深呼吸三次，把煩惱輕輕放下吧！`;
        }
      }

      resultText.innerText = reply;
      resultBox.style.display = "block";
      btn.disabled = false;
      btn.innerText = "請 AI 助教換角度看 ➔";
    }, 600);
  }

  function speakResult() {
    const text = document.getElementById('resultText').innerText;
    if ('speechSynthesis' in window && text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    } else {
      alert("您的手機瀏覽器不支援語音朗讀功能。");
    }
  }
</script>
</body>
</html>
